# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
# Alumni Portal — orchestration for development and production
#
# Commands:
#   Development (hot-reload):
#     docker compose up dev
#
#   Production (optimised standalone build):
#     docker compose up prod --build
#
#   Both:
#     docker compose up
# ──────────────────────────────────────────────────────────────────────────────

name: alumni-portal

services:

  # ── Development service ────────────────────────────────────────────────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: alumni-portal-dev
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source so edits reflect instantly (hot-reload)
      - .:/app
      # Keep container's node_modules isolated from host (avoids platform conflicts)
      - /app/node_modules
      # Persist Next.js cache across container restarts
      - next_cache_dev:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Firebase env vars (optional — leave blank if using mock mode)
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    profiles:
      - dev

  # ── Production service ─────────────────────────────────────────────────────
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: alumni-portal-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Firebase env vars (optional — leave blank if using mock mode)
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - prod

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  next_cache_dev:
    driver: local
